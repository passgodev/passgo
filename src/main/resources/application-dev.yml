spring:
  application:
    name: ${APP_NAME:dev_profile}
  config:
    import: optional:file:env/.env.dev[.properties]
  datasource:
    url: ${app.database.url}
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: false

logging:
  level:
    org.springframework: debug
    org.springframework.security: trace

app:
  database:
    url: jdbc:h2:mem:${DB_NAME}
  configuration:
    security:
      enabled: true