spring:
  datasource:
    name: ${PG_PASSGO_FLYWAY_DB}
    url: ${app.db.url}
    username: ${app.db.login}
    password: ${app.db.password}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    url: ${app.db.url}
    user: ${app.db.login}
    password: ${app.db.password}
    driver-class-name: org.postgresql.Driver

app:
  db:
    url: jdbc:postgresql://${DB_HOSTNAME}:${DB_PORT}/${PG_PASSGO_FLYWAY_DB}
    login: ${PG_PASSGO_FLYWAY_USER}
    password: ${PG_PASSGO_FLYWAY_PASSWORD}
  configuration:
    security:
      enabled: false