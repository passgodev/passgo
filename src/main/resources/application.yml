spring:
  application:
    name: ${APP_NAME:default_profile}
  profiles:
    default: local
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    name: ${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: none
  h2:
    console:
      enabled: false
  flyway:
    enabled: false

server:
  port: ${SERVER_PORT}
  servlet:
    context-path: /rest-api

app:
  database:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
  configuration:
    security:
      enabled: true
  upload-dir: uploads