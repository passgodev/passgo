http {
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

# https://serverfault.com/questions/577370/how-can-i-use-environment-variables-in-nginx-conf
# env variables
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/ssl/passgo.local.pem;
        ssl_certificate_key /etc/nginx/ssl/passgo.local-key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        add_header Strict-Transport-Security "max-age=0; includeSubDomains" always;

        location / {
            #proxy_pass http://host.docker.internal:8080; # nazwa usługi z docker-compose
            proxy_pass http://backend:8080; # nazwa usługi z docker-compose
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}